id = "bi#90"
title = "Ctrl+P model cycling over the scoped set"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi cycles models with app.model.cycleForward (default Ctrl+P),
honoring the scoped-models enablement set. Bi has the
/scoped-models verbs but no cycling hotkey — switching means the
full /model round-trip every time. Wire a cycle binding through the
bi#69 raw-mode layer; readline fallback stays numeric. Acceptance:
keypress advances provider/model within the enabled set and prints
the new backend; empty/disabled sets refuse loudly; binding shows in
/hotkeys.
"""

[[edge]]
from = "bi#90"
to = "bi#26"
kind = "DependsOn"

