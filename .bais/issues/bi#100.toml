id = "bi#100"
title = "Searchable session picker (/resume filter + startup picker)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi filters sessions by text (session-selector-search.ts, current +
all loaders) and offers a TUI picker for --resume
(cli/session-picker.ts). Bi's /resume is an unfiltered numbered
list and startup always mints a fresh session — finding last week's
session means leaving bi for ls/rg. Port the search rows into BAML
(id, label, timestamp, message count); host filters + picks behind
the bi#69 gate, numeric fallback stays. Acceptance: /resume filters
as you type; startup offers resume-vs-new; empty results read empty,
never error.

Progress (stays Open): `/resume <text>` now filters id/label/cwd
(case-insensitive) — exact id resumes directly, one match resumes it,
several render the filtered select frame for an id pick, zero matches
read `no sessions match` without erroring. Numeric picks still address
the full list. Verified live over a pty (seeded alpha/beta sessions)
plus baml/host suites green. Remaining for close: filter-as-you-type
and the startup resume-vs-new offer both need the bi#69 raw-mode
layer; the verb form here is the readline-era fulfillment.

Progress 2026-09-06 (stays Open): startup offer done WITHOUT bi#69 — repl() opens a New-first pickList over sessionResumeList on TTY with saved sessions (Esc/New mints fresh byte-identical to before; adopting skips the mint so no litter; --continue/--session/--print/pipes/empty stores skip). Adopted sessions seed file/turn/persisted/history like /resume. E2E: startup-picker-select (adopts, mints nothing) + startup-picker-new (Esc mints fresh), green in the 54-ok suite. Remaining for close: filter-as-you-type (genuinely needs bi#69).
"""

