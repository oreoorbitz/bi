body = """
Seeded via `bi bais new` for bi#115.

Found 2026-09-05 while proving the release-swallow fix over a pty
posing as a kitty flag-2 terminal (press+release per key, 40ms
cadence): typing `/quit` submitted `unknown slash /qu/quit`.
`tui.select.confirm` is Enter, so CR with the autocomplete list open
accepts the selection AND submits — against `autocompletePrefix`
from an older keystroke than the current line (BAML `complete_slash`
responses reorder under typing cadence), splicing a stale item over
fresh text. Whole-line-at-once input never trips it (no autocomplete
state at CR); human cadence trips it only when a suggestion round is
slower than a keystroke (cold VM first `/` is the likeliest window).
Acceptance: paced-typing probe submits `/quit` cleanly; Enter accepts
only completions computed against the submitted line; normal
Tab-accept flow unchanged; pipes unaffected (readline has no
autocomplete state).

Evidence: drill(prompt)
Evidence: drill(e2e-pty)

Verdict 2026-09-06: fixed host-side in makeSlashProvider.applyCompletion — when the text before the cursor no longer IS the recorded prefix, the splice is refused (line returned untouched): Enter submits what the user typed, Tab no-ops until a fresh round. No bi#69 needed (edge dropped): the stale round reaches applyCompletion through the current modal path. Unit stale-splice tests fail guard-less (`/q/quit ` mangle reproduced) and pass with it; normal Tab-accept + pipe gate unchanged (prompt.mjs green); paced-typing pty scenario quits clean with zero mangle (regression net — passes either way on warm rounds, noted in E2E.md)."""
