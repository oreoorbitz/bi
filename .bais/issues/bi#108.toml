body = """
Pi dialogs share chrome: DynamicBorder frames every selector,
BorderedLoader covers async waits (share upload), visual-truncate
keeps rows width-safe (dynamic-border.ts, bordered-loader.ts,
visual-truncate.ts). Bi's select frames (bi#68) have no border
primitive and no loader — each future dialog (login bi#94, share
progress, refresh bi#89) would hand-roll its own. Port the three
primitives once: BAML owns shaping/truncation (baml-testable),
host owns paint/tick. Acceptance: login + refresh + long lists
share the frame and loader; rows never exceed terminal width.

Evidence: drill(prompt)
Evidence: drill(e2e-pty)

Verdict 2026-09-06: all three primitives ported into bi/src/prompt.ts (host paint layer, matching pi where truncate lives with the Text component — BAML frames keep char-count truncate_chars). DynamicBorder (live-width rule, min 1) frames every modal pickList top/bottom; truncateVisual/visualWidth (UAX #11 BMP table, astral=2) caps titles, SelectList bodies stay width-safe internally; makeBorderedLoader (border/loader/[spacer+hint]/spacer/border, stop-on-teardown contract) built for login bi#94 + refresh bi#89 to wire. No bi#69 needed (edge dropped). prompt.mjs: 15 chrome checks green; full e2e (54 oks, framed pickers throughout) green 2x."""

