id = "bi#114"
title = "Screen mode on pi-tui (direction: depend, don't rebuild)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Decision (user-approved 2026-09-05): Bi's screen UI builds on
@earendil-works/pi-tui 0.84.3 (pinned, MIT, published — matches
../pi reference checkout) instead of hand-rolling widgets. BAML
keeps content/contracts/validation; pi-tui owns widgets (SelectList,
editor, focus, keys, repaint, overlays, markdown); the thin host
wires resolution. The line-mode paths (readline + renderSelectList +
pick.ts) stay as the pipe/non-screen fallback.

Spike verified live over a pty REPL (BI_SCREEN=1): src/screen-model.ts
drives pi-tui SelectList from ListAllModels rows (value = model id,
description = provider/ctx/current/disabled), Down+Enter switches
the backend through the existing apply path, Esc keeps the list,
terminal restores cleanly. Dep: @earendil-works/pi-tui = 0.84.3 in
bi/package.json (exact pin, no caret).

Slices (each: BAML rows in, pi-tui widget, host resolution, pty proof):
1. /model — LANDED 2026-09-05: default-on-TTY (BI_SCREEN=0 opts
out to the legacy picker; pipes unchanged), screen failure falls
back to the host picker. Verified live: Down+Enter switches,
Esc keeps a readable list, bare Tab still completes the space.
2. resume/tree/scoped/issues — LANDED 2026-09-05: one generic
screenPickList (screen.ts; ANSI stripped, index contract shared
with the legacy path, Esc keeps existing fallbacks). Verified live
in one REPL run: resume Enter resolves, tree/issues/scoped Esc
return to prompt, clean quit. screen-model.ts thinned onto the
same primitive (returns id).
2. /resume + /tree + /scoped-models + /issues pickers (rows already BAML-shaped).
3. Editor with autocomplete for the prompt line (retire readline).
4. Markdown transcript via pi-tui Markdown (bi#27 content work reuses).
5. Footer/status via layouts (retire scroll-region HostFooter).
6. Dialogs: login (bi#94), first-setup (bi#93), oauth/config selectors.

Supersede candidates (owner triage, not closed here): bi#69 raw-mode
layer (keys/focus owned by pi-tui; pick.ts stays as fallback), bi#95
countdown, bi#96 states, bi#108 chrome primitives, bi#92 hint
formatting (pi-tui keybinding-hints equivalent exists upstream).
Content issues survive unchanged: bi#85-87, bi#89, bi#93, bi#99-103.
"""

[[edge]]
from = "bi#114"
to = "bi#26"
kind = "DependsOn"
