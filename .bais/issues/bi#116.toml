body = """
Promote the /tmp pty probe to a committed harness: boot real bi in a pty against a mock backend (no LLM key), script a session (typed submit with kitty press+release events, flags replies), assert byte-exact transcripts. Accept: (1) harness lives in-repo and runs headless, (2) editor submit with kitty events resolves exact text, (3) late kitty/DA replies never surface, (4) trailing readline clean. Motivated by chronic kitty junk reports that never reproduce in unit probes.

Evidence: drill(e2e-pty)

Verdict 2026-09-05: committed as bi/scripts/e2e-pty.mjs (suite) + e2e-pty-spawn.py (python3 pty transport — node has no pty API, script(1) chokes on libuv socket stdio) + `npm run test:e2e`. Sandboxed HOME per scenario (seeded sessions, pre-trusted cwd), kitty flags+DA replies answered per burst. editor-kitty-submit types /nope via press+release per char and resolves `unknown slash /nope123`; 200ms-late replies never surface; every scenario asserts the no-leak invariant (?7u / 64;1;2 / :3u absent). Red-check: suspend reverted to pause() → `no reply bytes leak (/64;1;2/)` FAIL; restored → green. Suite green 3x consecutive (35 oks)."""
