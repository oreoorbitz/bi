id = "bi#96"
title = "Working-state indicator kinds (working/retry/compaction/branchSummary)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi's StatusIndicator (status-indicator.ts) distinguishes working,
retry, compaction, and branchSummary loader states — a retry storm
or background compaction reads differently from normal work. Bi's
retry (bi#16) and compaction (bi#11) are silent on the status path;
every wait looks identical. Add the kinds with distinct
spinner+message styling; BAML owns the text, host owns the tick.
Acceptance: a retry wait shows retry state with attempt count;
compaction shows compaction state; states never leak across turns.
"""

