id = "bi#107"
title = "Extension points (custom commands, working indicators) or deliberate-divergence note"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi extensions (core/extensions + extension-selector/editor/input)
let users add commands and custom working indicators
(WorkingIndicatorOptions feeds status-indicator). Bi has skills
only — no third-party command or indicator surface. This may be a
legitimate divergence (smaller surface, BAML-owned), but it must be
a DECISION, not drift. Either port the extension points (palette
commands + indicator options) or record the divergence with reasons
in bi#26. Acceptance: extensions work end-to-end, or bi#26 names the
divergence and /help explains why skills are the only surface.
"""

[[edge]]
from = "bi#107"
to = "bi#26"
kind = "DependsOn"
