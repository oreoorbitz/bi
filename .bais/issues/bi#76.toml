id = "bi#76"
title = "BAML hex escapes emit literal text — all styled output broken"
status = "Done"
kind = "Bug"
area = "tui"
body = """
Found smoking the bi#67 pinned footer: the frame painted literal
backslash-x-1-b text instead of dimming. Root cause: BAML 0.17.0 has
no hex or U+HHHH string escapes (probed: a backslash-x-1-b literal
measures 4 chars, a backslash-u literal measures 6, not 1), so every
theme code in theme.baml and the tui.baml cursor marker emitted
backslash text. Existing tests encoded the bug (both sides literal,
so they passed). Raw 0x1B/0x07 bytes in source work and survive
baml fmt (verified). Fix: raw bytes in theme.baml + tui.baml, length
asserts pinning real decoding, invisible-byte warnings at both sites.
Acceptance: styled footer renders dimmed on a TTY (no backslash
text); cursor marker strips in HostTui.
"""

[[edge]]
from = "bi#76"
to = "bi#26"
kind = "DependsOn"
