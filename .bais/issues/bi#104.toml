id = "bi#104"
title = "/reload only reloads skills, description promises six scopes"
status = "Done"
kind = "Bug"
area = "cli/bi"
body = """
The builtin registry (skills.baml) describes /reload as "Reload
keybindings, extensions, skills, prompts, themes, and context
files" — but src/cli.ts reloads skills only. Either the command is
five scopes short or the description over-claims; both cannot ship.
Fix by narrowing the description to what reloads, or widening the
handler per scope (keybindings/extensions legs wait on bi#69/bi#107;
prompts/themes/context files are host-FS work). Acceptance: every
scope named in the description reloads, or the description names
exactly the scopes that do; baml test pins the scope list.

Closed 2026-09-05 by narrowing: description is now "Reload skills
from trusted project directories" (skills.baml), matching the
handler (`loadSkills(await trustedSkillDirs(true))`, src/cli.ts).
Gates: baml check 43 files, baml test 274 passed, tsc + host suite
green. Widening legs stay tracked (bi#69/bi#107).
"""

[[edge]]
from = "bi#104"
to = "bi#26"
kind = "DependsOn"
