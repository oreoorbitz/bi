id = "bi#119"
title = "Kitty/DA reply tails typed into prompt input on slow links"
status = "Open"
kind = "Bug"
area = "tui"
body = """
Symptom: input contains 7u64;1;2;4;6;17;18;21;22;52c at load — tails of the kitty-flags reply (CSI ? 7 u) and DA reply (CSI ? 64;...;52 c) with the ESC[? prefixes eaten. Mechanism (proven in pty): each modal start() re-queries kitty; when a reply straddles pi-tui 150ms negotiation-fragment flush, the prefix flushes invisibly and the tail is typed into the focused widget. Fast-local links never split, which is why unit probes never reproduced it. Fix: runModal holds focus until the handshake settles (reply signal + 100ms quiet, 450ms cap) while the unfocused Tui drops tails. Red-check: neutering the settle reproduces the exact junk in the split probe; restored, green. Envelope: every reply byte within ~450ms of the query. Residual risk: stalls past 450ms, and ~110ms of early typeahead dropped per prompt on fast links. The committed e2e harness (bi#116) should measure focus latency and widen the envelope.

Update (hello3u): a second tail class — kitty RELEASES (`CSI …:3u`),
not negotiation replies. A release generated while the kitty pop is
still in flight (slow finger lift / slow link) arrives after modal
teardown, and readline mangles whole CSI-u into fragments (proven:
post-teardown `ESC[111;1:3u` surfaces as `3u`). Fix: post-submit
drainInput idle is SSH-gated (250ms over SSH_CONNECTION/SSH_TTY,
mirroring pi-tui's own SSH-gated escape timeout; 50ms local, zero
added latency). Red-check: forced short idle leaks `3uzzz`;
restored, all five pty scenarios green. Residual: releases past the
window, and pre-submit mid-sequence splits (StdinBuffer 50ms
reassembly, no knob) — filed upstream as proposals/14.

Update 2 (flags-5 push): reporter is on plain local iTerm2, and the
3u lands WHILE TYPING, pre-submit — so post-stop theories are out and
the drain fix only covers the post-submit half. Since no pi-tui or bi
component consumes press/release/repeat distinctly (verified: zero
wantsKeyRelease opt-ins, zero isKeyRepeat readers), runModal now
pushes kitty flags 1+4 after start (no event types, no releases ever
generated) and pops it after the drain pop (stack balanced 2/2 per
modal, verified 3x push-5 + 6x pops in pty transcript; non-kitty
terminals ignore both writes). Held keys degrade to legacy repeats.
This kills the whole release class pre- and post-submit on every
link; the settle (negotiation) and drain (stragglers) stay for the
rest. No value-level red-check applies: simulated releases are still
centrally dropped either way — the transcript counts plus the
event-less-press traffic run (FLAG5) are the verification.

Update 3 (field tap): reporter is local and the tails now show as
displayed glyphs below the footer, which local timing cannot explain
through arrival splits — suspect tty echo while cooked or a printed
dirty value instead. Added BI_TUI_DEBUG=/path.log (prompt.ts): a
process-lifetime observe-only tap logging timestamped raw stdin
chunks plus modal markers (start/focus kitty-state/resolve/drain/
stop). Verified in pty: whole replies, signal flip, chunk
coalescing all visible. Awaiting a field log from the reporter's
terminal to tell prefix-eating vs value-printing vs echo apart.

Update 4 (field log clean): reporter's tap log shows a fully clean
session — replies whole in ~1ms, focus kitty=true at +169ms, all
keys legacy single bytes (h/e/l/l/o, ESC[B arrows), zero releases,
zero splits, and the transcript matches. New finding: kitty
negotiates TRUE yet the terminal sends legacy encodings, so plain
typing can never produce releases — the 3u/7u events need enhanced
or modified keys, paste, resize, or a rare chunked moment, and are
intermittent by nature. Fix stands (no evidence against it);
need a tap log from a session where the line actually appears.

Update 5 (failing-run tap exonerates stdin): the run whose paste
shows divider+7u64… tails logged whole fast replies, correct focus,
and no other inbound bytes — stdin processing cannot have produced
that line. Extended the tap to wrap stdout/stderr (armed at import,
so load prints are covered): a reappearance is now attributable —
`out`/`err` lines mean bi printed it, `raw`-only means tty echo.
Leading theory for the pasted line is scrollback residue from an
older run; test is clear-buffer rerun with the tap armed.
"""

[[edge]]
from = "bi#119"
to = "bi#116"
