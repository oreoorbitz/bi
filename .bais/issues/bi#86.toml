id = "bi#86"
title = "Fork from a previous user message (message picker)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi's /fork creates the branch from a previous user message, picked
via user-message-selector.ts (entry id + text + timestamp rows).
Bi's /fork (src/cli.ts) always branches at the current position —
mid-session "retry from turn 3" is impossible. Port the picker rows
into BAML (same numbered-pick contract as bi#68), host wires
pickFromList behind the TTY gate. Acceptance: /fork with no arg
offers user-message rows; picking N forks the transcript at N;
numeric /fork <n> agrees with the listed rows; Esc keeps today.
"""

