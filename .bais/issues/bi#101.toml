id = "bi#101"
title = "Settings submenus (nested/stepped selectors)"
status = "Done"
kind = "Feat"
area = "tui"
body = """
Pi nests settings behind submenu components (settings-submenu.ts:
SelectSubmenu, SteppedSubmenu — e.g. provider -> auth method ->
key). Bi's /settings is flat get/set/unset verbs; multi-step
settings (OAuth provider choice) have no guided path. Port the
submenu walk into BAML (choice schema + validation), host drives
selection via the bi#69 layer. Acceptance: /settings opens sections;
stepped flows validate per step and abort atomically; verbs keep
working as shortcuts into the same walk.

Evidence: drill(e2e-pty)

Verdict 2026-09-06: done WITHOUT bi#69 (edge dropped) — sections run on modal pickLists. Bare /settings on TTY opens Backend/Theme/Show-all sections (Esc lists, pipes byte-identical). Backend steps provider→model→thinking with all picks resolved before a single validate_settings_async + one saveUserSettings + live apply (Esc anywhere aborts with nothing written). Theme reuses an extracted saveTheme shared with the /theme verb. E2E: settings-backend (stepped commit live+saved), settings-theme (pick asserts on disk), settings-esc (abort lists, writes nothing) — green in the 90-ok suite 2x."""

