id = "bi#98"
title = "Skill-invocation transcript blocks"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi renders skill invocations as transcript components
(skill-invocation-message.ts): which skill fired, with what input,
and its result boundary. Bi's skills (bi#12) are prompt context
only — agent_loop/conversation never render an invocation, so skill
use is invisible in review. Port the block shape into BAML;
host prints it around skill-provided guidance. Acceptance: every
skill invocation emits a named block; blocks export with /export;
disabled-model exclusions stay excluded.
"""

