id = "bi#103"
title = "Config selector UI (pi config-selector parity)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi selects configuration profiles through config-selector.ts
(component) + cli/config-selector.ts (startup path): named configs
with preview before commit. Bi's /config verbs edit values without
a selection surface — no preview, no named-profile switching. Audit
the current /config handler, then port the selector (BAML rows +
validation, host picking). Acceptance: bare /config lists profiles
with preview; switching validates before persisting; a bad profile
refuses atomically with its reason.
"""

