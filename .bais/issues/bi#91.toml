id = "bi#91"
title = "Custom keybindings file + manager"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi owns keybindings in core/keybindings.ts (KeybindingsManager,
keybindings.json overrides, custom editor bindings). Bi uses
readline defaults only — nothing is remappable, and skills.baml
already notes widget keybindings wait on raw mode. Add the manager
+ config file behind the bi#69 layer with readline fallback.
Acceptance: keybindings.json remaps at least cycle/pick/quit;
unknown ids fail loudly on load; /reload picks up edits.
"""

