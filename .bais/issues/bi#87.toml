id = "bi#87"
title = "Session-branch tree navigation (pi /tree semantics)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Pi's /tree navigates the SESSION tree (tree-selector.ts over
SessionTreeNode: indent + gutter, switch branches). Bi's /tree is a
directory browser for /attach — same name, different feature, so
branch switching has no UI at all. Decide the namespace (/tree stays
files + new /branches, or pi-parity rename), then port the flattened
node walk + gutter rendering into BAML. Acceptance: fork/clone
sessions appear as branches; selecting one switches the REPL to it;
directory browsing keeps working under its final name.
"""

