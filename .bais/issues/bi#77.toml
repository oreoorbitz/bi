id = "bi#77"
title = "Envelope emission from edit/write executors (diffs stage 2)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Stage 1 (merged) shaped unified diffs in BAML and wired emitToolDiff
behind path/before/after envelopes — but no executor emits envelopes,
so no edit turn shows a diff yet. Stage 2: edit/write executors
capture before/after and return the envelope. Open design point: the
envelope is model-visible tool output, so the shape must stay readable
to the model (path + unified hunks, not raw dumps) while the loop
keeps its existing contracts; oversized sides already fall back to
nothing. Acceptance: a live edit turn prints the BAML-shaped diff
inline; model edit behavior unchanged (existing agent tests green).
"""

