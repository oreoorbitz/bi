id = "bi#77"
title = "Envelope emission from edit/write executors (diffs stage 2)"
status = "Open"
kind = "Feat"
area = "tui"
body = """
Stage 1 (merged) shaped unified diffs in BAML and wired emitToolDiff
behind path/before/after envelopes — but nothing can fire them:
read/write/edit/bash have NO host executors (handleTool throws
"unknown tool ... need host impl" for all pi tools; only bais_* and
report_* run). Stage 2 is therefore bigger than envelopes: implement
minimal write/edit executors that capture before/after and return the
envelope. Open design points: (1) the envelope is model-visible tool
output — keep it readable (path + hunks, not dumps); oversized sides
already fall back to nothing; (2) SAFETY: autonomous file writes need
a policy — cwd jail + project-trust gate (deny refuses) at minimum.
Acceptance: a live edit turn writes the file AND prints the
BAML-shaped diff inline; writes outside the project refuse loudly.
"""

