id = "bi#106"
title = "Second-word Tab completion for every command; bare-command Tab is a silent no-op"
status = "Done"
kind = "Bug"
area = "tui"
body = """
Two completion gaps, both verified live: argCandidates
(src/cli.ts) covers model/thinking/theme/trust/changelog/settings/
issues/help only — name/fork/clone/resume/export/import/share and
the rest complete nothing; and bare `/model`+Tab is a silent no-op
(complete_slash returns ["/model"], readline shows nothing) because
second-word completion requires a trailing space. Cover every
command with a pool (ids, levels, verbs, session ids, paths) and
make bare-command Tab either complete the space or hint the pool.
Acceptance: /<cmd> <Tab> suggests for all 32 builtins; the no-space
case never fails silently.

Closed 2026-09-05: pools added in argCandidates (provider ids for
login/logout/oauth, session ids for resume, verbs+ids for
scoped-models, FS paths for tree/attach/import/export) + bare exact
command Tab completes the trailing space (src/cli.ts). Verified live
over a pty REPL: `/model`+Tab yields `/model ` (was a silent no-op);
host suite 98 oks. Bonus find while testing: zero-column ptys
collapsed every frame to "…" — fixed via termWidth() (tui.ts,
pick.ts, cli.ts dividers/footer/ready).
"""

